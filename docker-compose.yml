services:
  ai-service:
    build: ./ai-service
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  spring-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      AI_SERVICE_URL: http://ai-service:5000
    depends_on:
      ai-service:
        condition: service_healthy
